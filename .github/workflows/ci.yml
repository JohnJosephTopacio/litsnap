name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel stale PR runs, but never cancel a deploy halfway through.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:licenses
      - run: pnpm build

      # Playwright runs against the built app via `vite preview`, with the production CSP.
      - name: Install Playwright browser
        run: pnpm --filter @litsnap/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # On failure, keep Playwright's HTML report (screenshots and step-by-step traces).
      # Download it from the run's Summary page → Artifacts, then `npx playwright show-report <dir>`.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Secrets live on the "production" environment, so only this job can read them.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy worker
        run: pnpm --filter @litsnap/worker run deploy

      - name: Build web
        run: pnpm --filter @litsnap/web build

      - name: Create Pages project (first deploy only)
        working-directory: apps/web
        run: |
          if ! pnpm exec wrangler pages project list | grep -qw litsnap; then
            pnpm exec wrangler pages project create litsnap --production-branch main
          fi

      - name: Deploy web
        run: pnpm --filter @litsnap/web run deploy
